<html lang="en">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Crate</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
  :root {
    --bg: #0b0b0d; --card: #17171b; --card2: #202026; --line: #2a2a31;
    --text: #f4f4f6; --muted: #8d8d98; --accent: #f5a524; --accent-ink: #1a1203;
    --green: #30d158; --red: #ff453a;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-top: var(--safe-t); min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card2);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%;
    outline: none; font-size: 16px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; min-height: 70px; }
  select { appearance: none; -webkit-appearance: none;

    background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }

  .app { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }
  header { padding: 18px 0 8px; display: flex; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; }

  .toolbar { position: sticky; top: var(--safe-t); z-index: 5; background: linear-gradient(var(--bg) 85%, transparent);
    padding: 6px 0 12px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .search { position: relative; }
  .search input { padding-left: 40px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .toolbar select { padding: 10px 34px 10px 12px; font-size: 14px; }
  .viewbtn { flex: 0 0 44px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; }
  .viewbtn svg { width: 20px; height: 20px; }

  .section-h { margin: 20px 2px 10px; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .section-h b { color: var(--accent); font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile { text-align: left; display: block; width: 100%; }
  .cover { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card);
    box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { width: 100%; height: 100%; display: grid; place-items: center; font-weight: 800; font-size: 34px; color: rgba(255,255,255,.85); }
  .badge { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 700; padding: 3px 7px;
    border-radius: 99px; background: rgba(0,0,0,.65); backdrop-filter: blur(6px); }
  .badge.hi { background: var(--accent); color: var(--accent-ink); }
  .t-title { margin-top: 8px; font-weight: 650; font-size: 14px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .t-artist { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .list { display: grid; gap: 8px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 14px; padding: 10px; width: 100%; text-align: left; }
  .item .cover { width: 56px; flex: 0 0 56px; border-radius: 8px; box-shadow: none; }
  .item .ph { font-size: 20px; }
  .item .meta { flex: 1; min-width: 0; }
  .item .t-title { margin: 0; -webkit-line-clamp: 1; }
  .item .right { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 12px; }

  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty .disc { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle at center, var(--accent) 0 14%, #111 15% 30%, #1c1c20 31% 100%);
    box-shadow: 0 0 0 2px #26262c inset; }
  .empty b { color: var(--text); display: block; font-size: 18px; margin-bottom: 4px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(15,15,18,.88);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line);
    padding-bottom: var(--safe-b); }
  nav .in { max-width: 640px; margin: 0 auto; display: flex; }
  nav button { flex: 1; padding: 10px 0 8px; display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 600; }
  nav button.on { color: var(--accent); }
  nav svg { width: 24px; height: 24px; }
  .fab { position: fixed; right: 18px; bottom: calc(76px + var(--safe-b)); z-index: 11; width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(245,165,36,.4); }
  .fab svg { width: 28px; height: 28px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
    background: var(--card); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 10px 18px calc(24px + var(--safe-b)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.on { transform: none; }
  .sheet.tall { height: 92vh; overflow: hidden; display: flex; flex-direction: column; padding-bottom: calc(10px + var(--safe-b)); }
  .sheet.tall .scroll { flex: 1; overflow-y: auto; margin: 0 -18px; padding: 0 18px 16px; -webkit-overflow-scrolling: touch; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; flex: 0 0 auto; }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 3px; }

  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .btn { width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); margin-top: 18px; }

  .btn.danger { background: transparent; color: var(--red); margin-top: 6px; }
  .btn.small { width: auto; padding: 10px 14px; font-size: 14px; margin: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 18px 6px; margin: 0 -18px; scrollbar-width: none; flex: 0 0 auto; }
  .chips-row::-webkit-scrollbar { display: none; }
  .fchip { flex: 0 0 auto; padding: 8px 13px; border-radius: 99px; background: var(--card2); color: var(--muted); font-size: 13px; font-weight: 650; white-space: nowrap; border: 1px solid transparent; }

  .fchip.spot { border-color: #1db95466; color: #1ed760; }

  .arow { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #202026; }
  .arow .cover { width: 52px; flex: 0 0 52px; border-radius: 7px; box-shadow: none; }
  .arow .ph { font-size: 18px; }
  .arow .meta { flex: 1; min-width: 0; }
  .arow .t-title { margin: 0; -webkit-line-clamp: 1; }
  .addbtn { flex: 0 0 auto; min-width: 42px; height: 38px; padding: 0 12px; border-radius: 99px; background: var(--card2); font-weight: 800; font-size: 20px; color: var(--accent); display: grid; place-items: center; }

  .addbtn.other { background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
  .more { width: 100%; padding: 14px; color: var(--accent); font-weight: 700; }
  .grp { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 2px; }
  .linkbtn { color: var(--muted); font-size: 14px; text-decoration: underline; padding: 12px 0 4px; text-align: center; width: 100%; flex: 0 0 auto; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0; }

  .rate { display: flex; gap: 6px; }
  .rate button { font-size: 30px; line-height: 1; color: var(--line); padding: 2px; }
  .rate button.on { color: var(--accent); }

  .detail-cover { width: 62%; max-width: 260px; margin: 6px auto 16px; }
  .detail h2 { text-align: center; margin: 0; font-size: 22px; }
  .detail .by { text-align: center; color: var(--muted); margin: 4px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .chip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); }
  .notes { background: var(--card2); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 14px; color: #cfcfd6; white-space: pre-wrap; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 6px; }
  .stat { background: var(--card); border-radius: 16px; padding: 14px 10px; text-align: center; }
  .stat b { display: block; font-size: 28px; font-weight: 800; }
  .stat span { font-size: 12px; color: var(--muted); }
  .bars { background: var(--card); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .bar .l { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar .l span:last-child { color: var(--muted); }
  .bar .t { height: 8px; background: var(--card2); border-radius: 9px; overflow: hidden; }
  .bar .f { height: 100%; background: var(--accent); border-radius: 9px; }
  .toast { position: fixed; left: 50%; bottom: calc(150px + var(--safe-b)); transform: translateX(-50%) translateY(20px); background: #fff; color: #000;
    padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 40; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>

    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    disc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
  };

  /* ---------- render ---------- */
  function render() {
    var p = state.prefs;
    renderNav();
    $('fab').style.display = p.tab === 'stats' ? 'none' : 'grid';
    var app = $('app');
    if (p.tab === 'stats') { app.innerHTML = renderStats(); bindStats(); return; }

    var count = state.items.filter(function (i) { return i.list === p.tab; }).length;
    var isWish = p.tab === 'wishlist';
    var sortOpts = Object.keys(SORTS).filter(function (k) { return isWish ? k !== 'rating' : k !== 'priority'; })
      .map(function (k) { return '<option value="' + k + '"' + (p.sort === k ? ' selected' : '') + '>' + SORTS[k].label + '</option>'; }).join('');
    var groupOpts = Object.keys(GROUPS).filter(function (k) { return isWish ? k !== 'rating' : k !== 'priority'; })
      .map(function (k) { return '<option value="' + k + '"' + (p.group === k ? ' selected' : '') + '>' + GROUPS[k].label + '</option>'; }).join('');

    app.innerHTML = '<header><h1>' + (isWish ? 'Wishlist' : 'Collection') + '</h1><div class="sub">' + count + (count === 1 ? ' record' : ' records') + '</div></header>' +
      '<div class="toolbar">' +
        '<div class="search">' + ICON.search + '<input id="q" type="search" placeholder="Search title, artist, genre…" value="' + esc(p.q) + '"></div>' +
        '<div class="row"><select id="sort" aria-label="Sort">' + sortOpts + '</select>' +
        '<select id="group" aria-label="Group">' + groupOpts + '</select>' +
        '<button class="viewbtn" id="viewbtn" aria-label="Toggle view">' + (p.view === 'grid' ? ICON.list : ICON.grid) + '</button></div>' +
      '</div><div id="content"></div>';
    renderContent(visible(), isWish);

    $('q').addEventListener('input', function (e) { p.q = e.target.value; save(); renderContent(visible(), isWish); });
    $('sort').addEventListener('change', function (e) { p.sort = e.target.value; save(); renderContent(visible(), isWish); });
    $('group').addEventListener('change', function (e) { p.group = e.target.value; save(); renderContent(visible(), isWish); });
    $('viewbtn').addEventListener('click', function () { p.view = p.view === 'grid' ? 'list' : 'grid'; save(); render(); });
  }

  function renderContent(list, isWish) {
    var p = state.prefs, c = $('content');
    if (!list.length) {
      var searching = !!p.q;
      c.innerHTML = '<div class="empty"><div class="disc"></div><b>' +
        (searching ? 'Nothing found' : isWish ? 'Wishlist is empty' : 'No records yet') + '</b>' +
        (searching ? 'Try a different search.' : 'Tap + to add your first ' + (isWish ? 'want.' : 'album.')) + '</div>';
      return;
    }
    var gk = GROUPS[p.group] && !(isWish && p.group === 'rating') && !(!isWish && p.group === 'priority') ? p.group : 'none';
    var groups = {}, order = [];
    list.forEach(function (it) { var k = GROUPS[gk].key(it); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
    if (gk === 'decade') order.sort();
    if (gk === 'genre' || gk === 'artist') order.sort(function (a, b) { return article(a).localeCompare(article(b)); });
    if (gk === 'rating') order.sort().reverse();
    if (gk === 'priority') { var pr = { High: 3, Medium: 2, Low: 1 }; order.sort(function (a, b) { return (pr[b] || 0) - (pr[a] || 0); }); }

    var out = '';
    order.forEach(function (k) {
      if (gk !== 'none') out += '<div class="section-h"><span>' + esc(k) + '</span><b>' + groups[k].length + '</b></div>';
      out += p.view === 'grid' ? '<div class="grid">' + groups[k].map(tile).join('') + '</div>' : '<div class="list">' + groups[k].map(row).join('') + '</div>';
    });
    c.innerHTML = out;
    Array.prototype.forEach.call(c.querySelectorAll('[data-id]'), function (el) {
      el.addEventListener('click', function () { openDetail(el.getAttribute('data-id')); });
    });
    list.forEach(function (it) { if (!it.art) needArt(it.artist, it.title, false); });
  }

  function badgeFor(it) {
    if (it.list === 'wishlist') return it.priority === 3 ? '<span class="badge hi">High</span>' : '';
    return it.rating ? '<span class="badge">' + it.rating + ' ★</span>' : '';
  }
  function tile(it) {
    return '<button class="tile" data-id="' + it.id + '">' + coverHTML(it, badgeFor(it)) +
      '<div class="t-title">' + esc(it.title) + '</div><div class="t-artist">' + esc(it.artist) + (it.year ? ' · ' + it.year : '') + '</div></button>';
  }
  function row(it) {
    var right = it.list === 'collection' ? '<div class="stars">' + stars(it.rating) + '</div>' : '<div>' + (['', 'Low', 'Medium', 'High'][it.priority || 0] || '') + '</div>';
    return '<button class="item" data-id="' + it.id + '">' + coverHTML(it) +
      '<div class="meta"><div class="t-title">' + esc(it.title) + '</div><div class="t-artist">' + esc(it.artist) +
      (it.genre ? ' · ' + esc(it.genre) : '') + '</div></div><div class="right">' + (it.year || '') + right + '</div></button>';
  }

  function renderNav() {
    var t = state.prefs.tab;
    function b(id, label, icon) { return '<button data-tab="' + id + '" class="' + (t === id ? 'on' : '') + '">' + icon + label + '</button>'; }
    $('nav').innerHTML = b('collection', 'Collection', ICON.disc) + b('wishlist', 'Wishlist', ICON.heart) + b('stats', 'Stats', ICON.chart);
    Array.prototype.forEach.call($('nav').querySelectorAll('button'), function (el) {
      el.addEventListener('click', function () { state.prefs.tab = el.getAttribute('data-tab'); state.prefs.q = ''; save(); render(); window.scrollTo(0, 0); });
    });
  }

  /* ---------- stats ---------- */
  function countBy(arr, fn) { var m = {}; arr.forEach(function (i) { var k = fn(i); m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; }); }
  function bars(pairs, limit) {
    if (!pairs.length) return '<div class="sub">Nothing to show yet.</div>';
    pairs = pairs.slice(0, limit || 6);
    var max = pairs[0][1];
    return pairs.map(function (p) {
      return '<div class="bar"><div class="l"><span>' + esc(p[0]) + '</span><span>' + p[1] + '</span></div><div class="t"><div class="f" style="width:' + Math.round(p[1] / max * 100) + '%"></div></div></div>';
    }).join('');
  }
  function renderStats() {
    var coll = state.items.filter(function (i) { return i.list === 'collection'; });
    var wish = state.items.filter(function (i) { return i.list === 'wishlist'; });
    var rated = coll.filter(function (i) { return i.rating; });
    var avg = rated.length ? (rated.reduce(function (s, i) { return s + i.rating; }, 0) / rated.length).toFixed(1) : '–';
    var decs = countBy(coll, function (i) { return decade(i.year); }).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    return '<header><h1>Stats</h1></header>' +
      '<div class="stat-grid"><div class="stat"><b>' + coll.length + '</b><span>Owned</span></div>' +
      '<div class="stat"><b>' + wish.length + '</b><span>Wishlist</span></div>' +
      '<div class="stat"><b>' + avg + '</b><span>Avg rating</span></div></div>' +
      '<div class="section-h"><span>Top genres</span></div><div class="bars">' + bars(countBy(coll, function (i) { return i.genre || 'No genre'; })) + '</div>' +
      '<div class="section-h"><span>By decade</span></div><div class="bars">' + bars(decs, 12) + '</div>' +
      '<div class="section-h"><span>Top artists</span></div><div class="bars">' + bars(countBy(coll, function (i) { return i.artist || 'Unknown'; })) + '</div>' +
      '<div class="section-h"><span>Backup</span></div>' +
      '<div class="hint" style="margin:0 0 10px">Your records live in this browser on this device. Export a backup now and then, especially before clearing Safari data.</div>' +
      '<div class="row"><button class="btn ghost small" id="exp">Export backup</button><button class="btn ghost small" id="imp">Import backup</button></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn ghost small" id="rcv">Reload missing covers</button></div>';
  }
  function bindStats() {
    $('exp').addEventListener('click', function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'crate-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
    });
    $('imp').addEventListener('click', function () { $('importFile').click(); });
    $('rcv').addEventListener('click', function () {
      Object.keys(artCache).forEach(function (k) { if (!artCache[k]) delete artCache[k]; }); saveArt();
      var n = 0; state.items.forEach(function (it) { if (!it.art) { needArt(it.artist, it.title, false); n++; } });
      toast(n ? 'Fetching ' + n + ' covers…' : 'All covers loaded');
    });
  }
  $('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.items)) throw 0;
        if (!confirm('Replace everything with this backup (' + d.items.length + ' records)?')) return;
        state.items = d.items; if (d.prefs) Object.assign(state.prefs, d.prefs);
        save(); render(); toast('Backup restored');
      } catch (err) { alert('That file doesn\'t look like a Crate backup.'); }
    };
    r.readAsText(f); e.target.value = '';
  });

  /* ---------- sheets ---------- */
  function openSheet(html, tall) {
    var s = $('sheet'); s.className = 'sheet' + (tall ? ' tall' : '');
    s.innerHTML = '<div class="grab"></div>' + html;
    void s.offsetWidth; s.classList.add('on'); $('scrim').classList.add('on'); s.scrollTop = 0;
  }
  function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); addToken++; }
  $('scrim').addEventListener('click', closeSheet);

  function openDetail(id) {
    var it = state.items.filter(function (i) { return i.id === id; })[0]; if (!it) return;
    var chips = [];
    if (it.year) chips.push(it.year);
    if (it.genre) chips.push(esc(it.genre));
    if (it.list === 'wishlist' && it.priority) chips.push(['', 'Low', 'Medium', 'High'][it.priority] + ' priority');
    openSheet('<div class="detail"><div class="detail-cover">' + coverHTML(it) + '</div>' +
      '<h2>' + esc(it.title) + '</h2><div class="by">' + esc(it.artist) + '</div>' +
      '<div class="chips">' + chips.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('') + '</div>' +
      (it.rating ? '<div class="stars" style="text-align:center;font-size:18px">' + stars(it.rating) + '</div>' : '') +
      (it.notes ? '<div class="notes">' + esc(it.notes) + '</div>' : '') +
      (it.list === 'wishlist' ? '<button class="btn" id="own">Got it – move to collection</button>' : '') +
      '<button class="btn ghost" id="edit">Edit rating / notes</button>' +
      '<button class="btn danger" id="del">Delete</button></div>');
    var own = $('own');
    if (own) own.addEventListener('click', function () { it.list = 'collection'; it.added = Date.now(); save(); closeSheet(); render(); toast('Added to collection'); });
    $('edit').addEventListener('click', function () { openForm(it); });
    $('del').addEventListener('click', function () {
      if (confirm('Delete "' + it.title + '"?')) { state.items = state.items.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); }
    });
  }

  /* ---------- ADD: pick from the database ---------- */
  var addToken = 0;
  var add = { target: 'collection', chip: 'spot', q: '', shown: 40, live: [], liveFor: '' };
  var addMap = {};

  function findItem(key) {
    for (var i = 0; i < state.items.length; i++) if (artKey(state.items[i].artist, state.items[i].title) === key) return state.items[i];
    return null;
  }

  function openAdd() {
    add.target = state.prefs.tab === 'wishlist' ? 'wishlist' : 'collection';
    add.chip = 'spot'; add.q = ''; add.shown = 40; add.live = []; add.liveFor = '';
    var genres = Object.keys(CODES).map(function (k) { return CODES[k]; }).sort();
    var decs = [[1950, '50s'], [1960, '60s'], [1970, '70s'], [1980, '80s'], [1990, '90s'], [2000, '00s'], [2010, '10s'], [2020, '20s']];
    var chips = '<button class="fchip spot on" data-c="spot">Your Spotify</button><button class="fchip" data-c="all">All A–Z</button>' +
      decs.map(function (d) { return '<button class="fchip" data-c="d:' + d[0] + '">' + d[1] + '</button>'; }).join('') +
      genres.map(function (g) { return '<button class="fchip" data-c="g:' + esc(g) + '">' + esc(g) + '</button>'; }).join('');
    openSheet('<div class="seg" id="tgt"><button data-v="collection">Add to Collection</button><button data-v="wishlist">Add to Wishlist</button></div>' +
      '<div class="search" style="margin-top:10px"><input id="aq" type="search" placeholder="Search any album or artist…" autocomplete="off" autocorrect="off">' + ICON.search + '</div>' +
      '<div class="chips-row" id="chips">' + chips + '</div>' +
      '<div class="scroll" id="addscroll"><div id="addres"></div></div>' +
      '<button class="linkbtn" id="manual">Can\'t find it? Add manually</button>', true);

    function syncTgt() { Array.prototype.forEach.call($('tgt').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === add.target); }); }
    Array.prototype.forEach.call($('tgt').children, function (b) { b.addEventListener('click', function () { add.target = b.getAttribute('data-v'); syncTgt(); renderAdd(); }); });
    syncTgt();
    Array.prototype.forEach.call($('chips').children, function (b) {
      b.addEventListener('click', function () {
        add.chip = b.getAttribute('data-c'); add.shown = 40; $('aq').value = ''; add.q = ''; add.live = [];
        Array.prototype.forEach.call($('chips').children, function (x) { x.classList.toggle('on', x === b); });
        $('addscroll').scrollTop = 0; renderAdd();
      });
    });
    var timer;
    $('aq').addEventListener('input', function (e) {
      add.q = e.target.value.trim(); add.shown = 40; add.live = []; add.liveFor = '';
      Array.prototype.forEach.call($('chips').children, function (x) { x.classList.remove('on'); });
      if (!add.q) { add.chip = 'spot'; $('chips').children[0].classList.add('on'); }
      renderAdd();
      clearTimeout(timer);
      if (add.q.length >= 3) timer = setTimeout(function () { liveSearch(add.q); }, 450);
    });
    $('manual').addEventListener('click', function () { openForm(null, add.q); });
    renderAdd();
  }

  function localResults() {
    var q = norm(add.q), out;
    if (q) {
      var toks = q.split(/\s+/).filter(Boolean);
      out = CAT.map(function (a) {
        var hay = norm(a.artist + ' ' + a.title), ok = toks.every(function (t) { return hay.indexOf(t) > -1; });
        if (!ok) return null;
        var score = (norm(a.title).indexOf(q) === 0 ? 3 : 0) + (norm(a.artist).indexOf(q) === 0 ? 3 : 0) + (a.spot ? 1 : 0);
        return { a: a, s: score };
      }).filter(Boolean).sort(function (x, y) { return y.s - x.s; }).map(function (x) { return x.a; });
    } else if (add.chip === 'spot') {
      out = CAT.filter(function (a) { return a.spot; });
    } else if (add.chip.indexOf('d:') === 0) {
      var d0 = parseInt(add.chip.slice(2), 10); out = CAT.filter(function (a) { return a.year >= d0 && a.year < d0 + 10; });
    } else if (add.chip.indexOf('g:') === 0) {
      var g = add.chip.slice(2); out = CAT.filter(function (a) { return a.genre === g; });
    } else out = CAT.slice();
    if (!q) out.sort(function (x, y) { return article(x.artist).localeCompare(article(y.artist)) || x.year - y.year; });
    return out;
  }

  function addRow(a) {
    var key = artKey(a.artist, a.title); addMap[key] = a;
    var ex = findItem(key), btn;
    if (ex && ex.list === add.target) btn = '<button class="addbtn done" data-k="' + esc(key) + '" aria-label="Added">✓</button>';
    else if (ex) btn = '<button class="addbtn other" data-k="' + esc(key) + '">' + (ex.list === 'collection' ? 'Owned' : 'Wishlist') + '</button>';
    else btn = '<button class="addbtn" data-k="' + esc(key) + '" aria-label="Add">+</button>';
    return '<div class="arow">' + coverHTML({ artist: a.artist, title: a.title, art: a.art }) +
      '<div class="meta"><div class="t-title">' + esc(a.title) + '</div><div class="t-artist">' + esc(a.artist) + (a.year ? ' · ' + a.year : '') + (a.genre ? ' · ' + esc(a.genre) : '') + '</div></div>' + btn + '</div>';
  }

  var io = null;
  function renderAdd() {
    var res = localResults(), html = '';
    var seen = {}; res.forEach(function (a) { seen[artKey(a.artist, a.title)] = 1; });
    var live = add.live.filter(function (a) { return !seen[artKey(a.artist, a.title)]; });
    var titleTxt = add.q ? '' : add.chip === 'spot' ? '<div class="hint">' + res.length + ' albums from the artists in your Spotify playlist. Tap + to add.</div>'
      : '<div class="hint">' + res.length + ' albums. Use the search to find anything else.</div>';
    html += titleTxt;
    var shown = res.slice(0, add.shown);
    html += shown.map(addRow).join('');
    if (res.length > add.shown) html += '<button class="more" id="more">Show more (' + (res.length - add.shown) + ')</button>';
    if (add.q) {
      if (live.length) html += '<div class="grp">More from Apple Music</div>' + live.map(addRow).join('');
      else if (add.q.length >= 3) html += '<div class="hint">' + (add.liveFor === add.q ? (res.length ? 'No further matches online.' : 'No matches found. Try fewer words, or add it manually below.') : 'Searching the wider catalogue…') + '</div>';
      else if (!res.length) html += '<div class="hint">Keep typing…</div>';
    }
    $('addres').innerHTML = html;
    Array.prototype.forEach.call($('addres').querySelectorAll('.addbtn'), function (b) {
      b.addEventListener('click', function () { quickAdd(b.getAttribute('data-k'), b); });
    });
    var more = $('more'); if (more) more.addEventListener('click', function () { add.shown += 60; var y = $('addscroll').scrollTop; renderAdd(); $('addscroll').scrollTop = y; });

    // fetch artwork for rows as they scroll into view
    if (io) io.disconnect();
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          io.unobserve(en.target);
          var k = en.target.getAttribute('data-key'), a = addMap[k];
          if (a && !a.art) needArt(a.artist, a.title, true);
        });
      }, { root: $('addscroll'), rootMargin: '120px' });
      Array.prototype.forEach.call($('addres').querySelectorAll('.cover[data-key]'), function (el) { io.observe(el); });
    }
  }

  function liveSearch(q) {
    var token = ++addToken;
    function show(list) { if (token !== addToken || add.q !== q) return; add.live = list; add.liveFor = q; saveArt(); renderAdd(); }
    function viaDeezer() {
      jsonp('https://api.deezer.com/search/album?limit=25&q=' + encodeURIComponent(q), function (err, d) {
        if (err || !d || d.error) return show([]);
        show((d.data || []).filter(function (r) { return r.title && r.artist; }).map(function (r) {
          var art = r.cover_big || r.cover_medium || '';
          var a = { artist: r.artist.name, title: r.title, year: '', genre: '', art: art, live: true };
          if (art) artCache[artKey(a.artist, a.title)] = art;
          return a;
        }));
      });
    }
    fetch('https://itunes.apple.com/search?media=music&entity=album&limit=25&term=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
      .then(function (d) {
        var list = (d.results || []).filter(function (r) { return r.collectionName; }).map(function (r) {
          var art = (r.artworkUrl100 || '').replace('100x100bb', '500x500bb');
          var a = { artist: r.artistName, title: r.collectionName.replace(/\s*-\s*(Single|EP)$/i, ''), year: parseInt((r.releaseDate || '').slice(0, 4), 10) || '', genre: r.primaryGenreName || '', art: art, live: true };
          if (art) artCache[artKey(a.artist, a.title)] = art;
          return a;
        });
        if (!list.length) return viaDeezer();
        show(list);
      })
      .catch(function () { viaDeezer(); });
  }

    function quickAdd(key, btn) {
    var a = addMap[key]; if (!a) return;
    var ex = findItem(key);
    if (ex) { toast(ex.list === add.target ? 'Already in your ' + add.target : 'Already in your ' + ex.list); return; }
    state.items.push({ id: uid(), title: a.title, artist: a.artist, year: a.year, genre: a.genre, art: a.art || artCache[key] || '',
      rating: 0, priority: 2, notes: '', list: add.target, added: Date.now() });
    save();
    btn.className = 'addbtn done'; btn.textContent = '✓';
    toast('Added to ' + add.target);
    if (!a.art && !artCache[key]) needArt(a.artist, a.title, true);
    render();
  }

  /* ---------- manual / edit form ---------- */
  function openForm(existing, prefill) {
    var it = existing || { id: uid(), title: prefill || '', artist: '', year: '', genre: '', art: '', rating: 0, priority: 2, notes: '',
      list: state.prefs.tab === 'wishlist' ? 'wishlist' : 'collection', added: Date.now() };
    var draft = JSON.parse(JSON.stringify(it));

    openSheet('<h2>' + (existing ? 'Edit record' : 'Add manually') + '</h2>' +
      '<div class="seg" id="listseg"><button data-v="collection">Collection</button><button data-v="wishlist">Wishlist</button></div>' +
      '<label>Title</label><input id="f_title" value="' + esc(draft.title) + '">' +
      '<label>Artist</label><input id="f_artist" value="' + esc(draft.artist) + '">' +
      '<div class="two"><div><label>Year</label><input id="f_year" inputmode="numeric" maxlength="4" value="' + esc(draft.year) + '"></div>' +
      '<div><label>Genre</label><input id="f_genre" list="genres" value="' + esc(draft.genre) + '"></div></div>' +
      '<datalist id="genres">' + genreList().map(function (g) { return '<option value="' + esc(g) + '">'; }).join('') + '</datalist>' +
      '<div id="ratewrap"><label>Rating</label><div class="rate" id="rate"></div></div>' +
      '<div id="priowrap"><label>Priority</label><div class="seg" id="prioseg"><button data-v="1">Low</button><button data-v="2">Medium</button><button data-v="3">High</button></div></div>' +
      '<label>Notes</label><textarea id="f_notes" placeholder="Pressing, colour, where you bought it…">' + esc(draft.notes) + '</textarea>' +
      '<button class="btn" id="saveBtn">' + (existing ? 'Save changes' : 'Add') + '</button>' +
      '<button class="btn ghost" id="cancelBtn">Cancel</button>');

    function sync() {
      Array.prototype.forEach.call($('listseg').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === draft.list); });
      Array.prototype.forEach.call($('prioseg').children, function (b) { b.classList.toggle('on', +b.getAttribute('data-v') === draft.priority); });
      $('ratewrap').style.display = draft.list === 'collection' ? 'block' : 'none';
      $('priowrap').style.display = draft.list === 'wishlist' ? 'block' : 'none';
      $('rate').innerHTML = [1, 2, 3, 4, 5].map(function (n) { return '<button data-n="' + n + '" class="' + (draft.rating >= n ? 'on' : '') + '">★</button>'; }).join('');
      Array.prototype.forEach.call($('rate').children, function (b) {
        b.addEventListener('click', function () { var n = +b.getAttribute('data-n'); draft.rating = draft.rating === n ? 0 : n; sync(); });
      });
    }
    Array.prototype.forEach.call($('listseg').children, function (b) { b.addEventListener('click', function () { draft.list = b.getAttribute('data-v'); sync(); }); });
    Array.prototype.forEach.call($('prioseg').children, function (b) { b.addEventListener('click', function () { draft.priority = +b.getAttribute('data-v'); sync(); }); });
    sync();

    $('cancelBtn').addEventListener('click', function () { existing ? openDetail(existing.id) : closeSheet(); });
    $('saveBtn').addEventListener('click', function () {
      var title = $('f_title').value.trim(), artist = $('f_artist').value.trim();
      if (!title) { toast('Add a title'); $('f_title').focus(); return; }
      draft.title = title; draft.artist = artist || 'Unknown artist';
      var y = parseInt($('f_year').value, 10); draft.year = y > 1800 && y < 2100 ? y : '';
      draft.genre = $('f_genre').value.trim(); draft.notes = $('f_notes').value.trim();
      if (draft.list === 'wishlist') draft.rating = 0;
      if (existing) Object.assign(existing, draft); else state.items.push(draft);
      state.prefs.tab = draft.list; state.prefs.q = '';
      save(); closeSheet(); render(); toast(existing ? 'Saved' : 'Added');
    });
  }

  function genreList() {
    var base = Object.keys(CODES).map(function (k) { return CODES[k]; });
    state.items.forEach(function (i) { if (i.genre && base.indexOf(i.genre) < 0) base.push(i.genre); });
    return base;
  }

  $('fab').addEventListener('click', openAdd);

document.addEventListener('error', function (e) {
    var el = e.target; if (!el || el.tagName !== 'IMG' || !el.closest) return;
    var c = el.closest('.cover'); if (!c) return;
    var key = c.getAttribute('data-key') || '', h = hue(key);
    el.parentNode.removeChild(el);
    if (!c.querySelector('.ph')) c.insertAdjacentHTML('afterbegin', '<div class="ph" style="background:linear-gradient(135deg,hsl(' + h + ',55%,38%),hsl(' + ((h + 50) % 360) + ',60%,22%))">' + esc(c.getAttribute('data-l') || '♪') + '</div>');
    if (key && artCache[key]) { delete artCache[key]; saveArt(); }
  }, true);

  load(); makeIcon(); render();
})();
</script>
</body>
</html>
